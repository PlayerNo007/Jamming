name: Feature request
description: An idea to make Jamming better.
title: "[Idea] "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What should Jamming do?
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why would it help?
      description: When would you use it? What does it make easier?
